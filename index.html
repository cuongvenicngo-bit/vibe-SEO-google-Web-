<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHÂN TÍCH WEB 360 - Đánh giá toàn diện website từ nội dung đến chuyển đổi</title>
    <meta name="description" content="Đánh giá toàn diện website từ nội dung đến chuyển đổi bằng AI, so sánh 5 đối thủ, kiểm tra 29 tiêu chí, tìm khoảng trống cơ hội và lập kế hoạch thực thi." />
    <meta property="og:title" content="PHÂN TÍCH WEB 360 - Đánh giá toàn diện website" />
    <meta property="og:description" content="Đánh giá toàn diện website từ nội dung đến chuyển đổi bằng AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      // Reads the same key/value format the app's useLocalStorage('web360_theme') writes.
      try {
        if (JSON.parse(localStorage.getItem('web360_theme')) === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
